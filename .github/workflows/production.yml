name: Validate and deploy Turkey Vulture
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turkey-vulture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx wrangler versions upload --dry-run --no-x-provision --outdir .wrangler/dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: b1aa310aa0a1638d72b8b086a21e557c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Require an account-owned deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Missing stable CLOUDFLARE_API_TOKEN repository secret. Do not use a rotating local Wrangler OAuth token.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Verify existing Custom Domains read-only
        run: node scripts/check-cloudflare-target.mjs --write-snapshot "$RUNNER_TEMP/tvs-domains.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload the validated Worker version without changing triggers
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler versions upload --no-x-provision --tag "$GITHUB_SHA" \
            --message "GitHub Actions release $GITHUB_SHA (run $GITHUB_RUN_ID)" \
            2>&1 | tee "$RUNNER_TEMP/tvs-version-upload.log"
          node scripts/read-upload-version.mjs "$RUNNER_TEMP/tvs-version-upload.log" >> "$GITHUB_OUTPUT"
      - name: Confirm domain bindings are unchanged before activation
        run: node scripts/check-cloudflare-target.mjs --compare-snapshot "$RUNNER_TEMP/tvs-domains.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Activate only the uploaded Worker version
        run: npx wrangler versions deploy "$VERSION_ID@100%" --yes --message "GitHub Actions release $GITHUB_SHA (run $GITHUB_RUN_ID)"
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Confirm domain bindings are unchanged after activation
        run: node scripts/check-cloudflare-target.mjs --compare-snapshot "$RUNNER_TEMP/tvs-domains.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the deployed HTTPS revision
        run: npm run verify:production
      - name: Record verified release
        run: |
          echo "Deployed and verified commit $GITHUB_SHA at https://turkeyvulturesoftware.com from GitHub Actions run $GITHUB_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
